<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CallMind Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: transparent;
      overflow: hidden;
    }
    
    /* Launcher Button */
    #cm-launcher {
      position: fixed;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.1);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999999;
    }
    
    #cm-launcher:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    }
    
    #cm-launcher svg {
      width: 28px;
      height: 28px;
      fill: white;
    }
    
    /* Chat Window */
    #cm-chat {
      position: fixed;
      width: 380px;
      height: 600px;
      max-height: calc(100vh - 100px);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.9) translateY(20px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999998;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    
    #cm-chat.cm-open {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: all;
    }
    
    /* Mobile Styles */
    @media (max-width: 640px) {
      #cm-chat {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        transform: translateY(100%);
      }
      
      #cm-chat.cm-open {
        transform: translateY(0);
      }
      
      #cm-launcher {
        width: 48px;
        height: 48px;
      }
    }
    
    /* Header */
    #cm-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid;
    }
    
    #cm-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    #cm-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(255,255,255,0.2);
    }
    
    #cm-title-text {
      font-weight: 600;
      font-size: 15px;
    }
    
    #cm-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    
    #cm-close:hover {
      background: rgba(0,0,0,0.1);
    }
    
    /* Messages */
    #cm-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .cm-message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: cm-fade-in 0.3s ease;
    }
    
    @keyframes cm-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .cm-message-user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    
    .cm-message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    
    .cm-message-content {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    
    .cm-message-bot .cm-message-content {
      background: rgba(0,0,0,0.05);
      border-bottom-left-radius: 4px;
    }
    
    .cm-message-user .cm-message-content {
      border-bottom-right-radius: 4px;
      color: white;
    }
    
    /* Typing Indicator */
    .cm-typing {
      display: flex;
      gap: 4px;
      padding: 16px;
      align-items: center;
    }
    
    .cm-typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: cm-typing 1.4s infinite;
    }
    
    .cm-typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .cm-typing-dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes cm-typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }
    
    /* Input Area */
    #cm-input-area {
      padding: 16px 20px;
      border-top: 1px solid;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    #cm-textarea {
      flex: 1;
      border: 1px solid;
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      min-height: 44px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    #cm-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    #cm-send:hover:not(:disabled) {
      transform: scale(1.05);
    }
    
    #cm-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Scrollbar */
    #cm-messages::-webkit-scrollbar {
      width: 6px;
    }
    
    #cm-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    
    #cm-messages::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 3px;
    }
    
    /* Light Theme */
    .cm-theme-light #cm-chat {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.1);
    }
    
    .cm-theme-light #cm-header {
      background: rgba(255,255,255,0.5);
      border-color: rgba(0,0,0,0.05);
    }
    
    .cm-theme-light #cm-title-text { color: #1a1a1a; }
    .cm-theme-light .cm-message-avatar { background: #f0f0f0; }
    .cm-theme-light .cm-message-content { color: #333; }
    .cm-theme-light #cm-input-area { border-color: rgba(0,0,0,0.05); }
    .cm-theme-light #cm-textarea {
      background: white;
      border-color: rgba(0,0,0,0.1);
      color: #333;
    }
    .cm-theme-light #cm-textarea:focus { border-color: var(--cm-primary); }
    .cm-theme-light .cm-typing-dot { background: #999; }
    
    /* Dark Theme */
    .cm-theme-dark #cm-chat {
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .cm-theme-dark #cm-header {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
    }
    
    .cm-theme-dark #cm-title-text { color: #fff; }
    .cm-theme-dark .cm-message-avatar { background: rgba(255,255,255,0.1); }
    .cm-theme-dark .cm-message-content { color: #e0e0e0; }
    .cm-theme-dark .cm-message-bot .cm-message-content { background: rgba(255,255,255,0.1); }
    .cm-theme-dark #cm-input-area { border-color: rgba(255,255,255,0.1); }
    .cm-theme-dark #cm-textarea {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
    .cm-theme-dark #cm-textarea:focus { border-color: var(--cm-primary); }
    .cm-theme-dark .cm-typing-dot { background: #666; }
    .cm-theme-dark #cm-close { background: rgba(255,255,255,0.1); }
    .cm-theme-dark #cm-close:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <button id="cm-launcher">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
  </button>
  
  <div id="cm-chat">
    <div id="cm-header">
      <div id="cm-header-info">
        <div id="cm-avatar">🤖</div>
        <div id="cm-title-text">Chat Support</div>
      </div>
      <button id="cm-close">✕</button>
    </div>
    
    <div id="cm-messages"></div>
    
    <div id="cm-input-area">
      <textarea id="cm-textarea" rows="1" placeholder="Type your message..."></textarea>
      <button id="cm-send">➤</button>
    </div>
  </div>

  <script>
    (function() {
      // Parse URL parameters
      const params = new URLSearchParams(window.location.search);
      const CONFIG = {
        agentId: params.get('agentId'),
        apiKey: params.get('apiKey'),
        apiUrl: params.get('apiUrl') || 'https://api.iamspiderman.me',
        theme: params.get('theme') || 'light',
        position: params.get('position') || 'bottom-right',
        primaryColor: params.get('primaryColor') || '#3b82f6',
        greeting: params.get('greeting') || 'Hello! How can I help you today?',
        title: params.get('title') || 'Chat Support',
        placeholder: params.get('placeholder') || 'Type your message...',
      };
      
      if (!CONFIG.agentId || !CONFIG.apiKey) {
        document.body.innerHTML = '<div style="padding:20px;color:red;">Missing agentId or apiKey</div>';
        return;
      }
      
      // Apply theme and position
      document.body.className = `cm-theme-${CONFIG.theme}`;
      document.body.style.setProperty('--cm-primary', CONFIG.primaryColor);
      
      const launcher = document.getElementById('cm-launcher');
      const chat = document.getElementById('cm-chat');
      const position = CONFIG.position === 'bottom-left' ? { left: '20px', bottom: '20px' } : { right: '20px', bottom: '20px' };
      launcher.style.left = position.left;
      launcher.style.right = position.right;
      launcher.style.bottom = position.bottom;
      launcher.style.background = CONFIG.primaryColor;
      
      const chatPos = CONFIG.position === 'bottom-left' ? { left: '20px', bottom: '90px' } : { right: '20px', bottom: '90px' };
      chat.style.left = chatPos.left;
      chat.style.right = chatPos.right;
      chat.style.bottom = chatPos.bottom;
      
      // Set title and placeholder
      document.getElementById('cm-title-text').textContent = CONFIG.title;
      document.getElementById('cm-textarea').placeholder = CONFIG.placeholder;
      
      // State
      let isOpen = false;
      let conversationId = null;
      let isLoading = false;
      
      // Toggle chat
      launcher.addEventListener('click', () => {
        isOpen = !isOpen;
        chat.classList.toggle('cm-open', isOpen);
        if (isOpen && document.getElementById('cm-messages').children.length === 0) {
          addMessage('bot', CONFIG.greeting);
        }
      });
      
      document.getElementById('cm-close').addEventListener('click', () => {
        isOpen = false;
        chat.classList.remove('cm-open');
      });
      
      // Add message
      function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `cm-message cm-message-${role}`;
        div.innerHTML = `
          <div class="cm-message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
          <div class="cm-message-content">${escapeHtml(text)}</div>
        `;
        document.getElementById('cm-messages').appendChild(div);
        document.getElementById('cm-messages').scrollTop = document.getElementById('cm-messages').scrollHeight;
      }
      
      function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      
      // Show typing
      function showTyping() {
        const div = document.createElement('div');
        div.className = 'cm-message cm-message-bot cm-typing-indicator';
        div.innerHTML = `
          <div class="cm-message-avatar">🤖</div>
          <div class="cm-typing">
            <div class="cm-typing-dot"></div>
            <div class="cm-typing-dot"></div>
            <div class="cm-typing-dot"></div>
          </div>
        `;
        document.getElementById('cm-messages').appendChild(div);
        document.getElementById('cm-messages').scrollTop = document.getElementById('cm-messages').scrollHeight;
      }
      
      function hideTyping() {
        const indicator = document.querySelector('.cm-typing-indicator');
        if (indicator) indicator.remove();
      }
      
      // Send message
      async function sendMessage(text) {
        if (isLoading || !text.trim()) return;
        
        document.getElementById('cm-textarea').value = '';
        addMessage('user', text);
        showTyping();
        isLoading = true;
        document.getElementById('cm-send').disabled = true;
        
        try {
          const response = await fetch(`${CONFIG.apiUrl}/query`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-API-Key': CONFIG.apiKey,
              'X-Source': 'widget',
            },
            body: JSON.stringify({
              agent_id: CONFIG.agentId,
              text: text,
              conversation_id: conversationId,
              stream: true,
            }),
          });
          
          if (!response.ok) throw new Error('Request failed');
          
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let botText = '';
          let botEl = null;
          
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            const lines = decoder.decode(value).split('\n');
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const data = line.slice(6);
                if (data === '[DONE]') continue;
                try {
                  const parsed = JSON.parse(data);
                  if (parsed.conversation_id) conversationId = parsed.conversation_id;
                  if (parsed.delta) {
                    if (!botEl) {
                      hideTyping();
                      botEl = document.createElement('div');
                      botEl.className = 'cm-message cm-message-bot';
                      botEl.innerHTML = `<div class="cm-message-avatar">🤖</div><div class="cm-message-content"></div>`;
                      document.getElementById('cm-messages').appendChild(botEl);
                    }
                    botText += parsed.delta;
                    botEl.querySelector('.cm-message-content').textContent = botText;
                    document.getElementById('cm-messages').scrollTop = document.getElementById('cm-messages').scrollHeight;
                  }
                } catch (e) {}
              }
            }
          }
        } catch (err) {
          hideTyping();
          addMessage('bot', 'Sorry, something went wrong. Please try again.');
        } finally {
          isLoading = false;
          document.getElementById('cm-send').disabled = false;
        }
      }
      
      // Event listeners
      document.getElementById('cm-send').addEventListener('click', () => {
        sendMessage(document.getElementById('cm-textarea').value);
      });
      
      document.getElementById('cm-textarea').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(e.target.value);
        }
      });
      
      // Auto-resize textarea
      document.getElementById('cm-textarea').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
      
      // Notify parent when ready
      window.parent.postMessage({ type: 'callmind-ready' }, '*');
    })();
  </script>
</body>
</html>
